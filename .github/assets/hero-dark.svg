<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="glow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa" />
      <stop offset="50%" style="stop-color:#22d3ee" />
      <stop offset="100%" style="stop-color:#f472b6" />
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <circle cx="200" cy="200" r="180" fill="url(#glow1)" filter="url(#blur1)">
    <animate attributeName="cy" values="200;180;200" dur="6s" repeatCount="indefinite" />
    <animate attributeName="r" values="180;200;180" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="150" r="150" fill="url(#glow2)" filter="url(#blur1)">
    <animate attributeName="cy" values="150;170;150" dur="7s" repeatCount="indefinite" />
  </circle>

  <g transform="translate(600, 140)">
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="url(#textGrad)" letter-spacing="-2">
      kleia
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" />
    </text>
  </g>

  <g transform="translate(600, 220)">
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#9ca3af" letter-spacing="4" font-weight="300">
      learn together, grow together
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" />
    </text>
  </g>

  <g transform="translate(600, 300)">
    <a href="https://www.kleia.site">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="white" opacity="0.9">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
      </rect>
      <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#0a0a0f" font-weight="600" dy="5">Visit kleia.site</text>
    </a>
  </g>

  <g transform="translate(600, 340)">
    <circle cx="0" cy="0" r="4" fill="#8b5cf6" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="30" cy="0" r="4" fill="#06b6d4" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" begin="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="60" cy="0" r="4" fill="#f472b6" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" begin="2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
