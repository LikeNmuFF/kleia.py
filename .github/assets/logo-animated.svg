<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa" />
      <stop offset="50%" style="stop-color:#22d3ee" />
      <stop offset="100%" style="stop-color:#f472b6" />
    </linearGradient>
  </defs>
  <g transform="translate(40, 40)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#logoGrad)" stroke-width="3" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#logoGrad)" stroke-width="2" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="10" fill="url(#logoGrad)" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite" />
      <animate attributeName="r" values="10;12;10" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>
  <text x="90" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="url(#logoGrad)" letter-spacing="-1">
    kleia
  </text>
  <text x="90" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" letter-spacing="3" font-weight="400">
    learn together, grow together
  </text>
</svg>
